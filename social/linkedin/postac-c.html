<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Postać · C · fala, osoba po lewej</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- LI POSTAĆ · C · 1200×1500
     The mirror of B: the person on the left, copy in the right lane. The wave
     rises behind the person and dips under the copy, so the oversized word sits
     on the green and the closing line on the cream. The mark stays top-left,
     above the person's head, as on every post. -->
<div class="ps-canvas ps-canvas--linkedin ps-canvas--gradient-green-v">
  <svg class="ps-canvas__wave" viewBox="0 0 1080 1350" preserveAspectRatio="none" aria-hidden="true"><path d="M0 520 C 140 480 300 500 430 610 C 560 720 780 790 1080 720 L1080 1350 L0 1350 Z"/></svg>
  <img class="ps-canvas__cutout" src="../../assets/photo/cutout-a.png" alt="Asia" style="left:-100px;height:1111px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__lane ps-canvas__lane--end" style="width:511px;margin:49px 0 auto">
    <p class="ps-canvas__kicker">Profil</p>
    <p class="ps-canvas__word" style="margin-top:7px;font-size:222px">PCM</p>
    <p class="ps-canvas__kicker" style="margin-top:20px">Się nie zmienia, to inwestycja na całe życie</p>
  </div>
  <div class="ps-canvas__lane ps-canvas__lane--end" style="width:511px;color:var(--ps-teal-900)">
    <p style="margin:0"><span class="ps-canvas__bar" style="font-size:38px">To nie test „na chwilę”.</span></p>
    <p class="ps-canvas__kicker" style="margin-top:22px;font-size:42px">To wiedza, do której wracasz przy zmianie pracy, awansie, kryzysie czy budowaniu relacji.</p>
  </div>
</div>
</body></html>
