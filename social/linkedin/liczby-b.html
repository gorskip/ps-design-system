<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>LI 07 · Trzy liczby</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- LI 07 · METRIC ROW · 1200×1500
     LinkedIn rewards a claim you can check. Three figures, one sentence each,
     on the deep green gradient — the no-violet field, so a company page can
     post it next to a signature-gradient graphic without the two clashing. -->
<div class="ps-canvas ps-canvas--linkedin ps-canvas--gradient-green">
  <img class="ps-canvas__motif ps-canvas__motif--tr" src="../../assets/logo/mark-texture-dark.svg" alt="" style="width:700px;right:-220px;top:-240px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <hr class="ps-canvas__rule">
    <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-on-deep);margin-top:28px">Diagnoza współpracy</p>
    <h1 class="ps-canvas__hook" style="margin-top:24px;font-size:84px">Co widać po czterech tygodniach</h1>
  </div>
  <div style="position:relative;z-index:2;display:grid;gap:52px">
    <div style="display:flex;align-items:baseline;gap:34px"><b style="font-size:104px;font-weight:300;letter-spacing:-.04em;line-height:1">0</b><span style="font-size:36px;line-height:1.3;opacity:.86">osoby, przez które przechodzi każda decyzja</span></div>
    <div style="display:flex;align-items:baseline;gap:34px"><b style="font-size:104px;font-weight:300;letter-spacing:-.04em;line-height:1">00<span style="font-size:52px"> h</span></b><span style="font-size:36px;line-height:1.3;opacity:.86">tygodniowo na spotkaniach zarządu</span></div>
    <div style="display:flex;align-items:baseline;gap:34px"><b style="font-size:104px;font-weight:300;letter-spacing:-.04em;line-height:1">0</b><span style="font-size:36px;line-height:1.3;opacity:.86">spisanych zasad eskalacji</span></div>
    <p style="font-size:30px;opacity:.8;margin:0">Miejsce na źródło</p>
  </div>
</div>
</body></html>
