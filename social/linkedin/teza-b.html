<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>LI 05 · Artykuł</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- LI 05 · ARTICLE PROMO · 1200×1500
     The headline is the article's real H1, not a rewrite — a reader who
     clicks should land on the sentence they were promised. -->
<div class="ps-canvas ps-canvas--linkedin ps-canvas--deep">
  <span class="ps-canvas__stamp" style="color:var(--ps-cream)"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <img class="ps-canvas__motif ps-canvas__motif--br" src="../../assets/logo/mark-texture-dark.svg" alt="">
  <div style="position:relative;z-index:2;margin-top:auto">
    <hr class="ps-canvas__rule">
    <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-on-deep)">Nowy artykuł</p>
    <h2 class="ps-canvas__hook" style="margin-top:26px">Zaufanie w firmie zaczyna się wcześniej, niż myślisz</h2>
    <ul class="ps-canvas__ticks" style="margin-top:52px">
      <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Cztery pozycje życiowe w zespole</span></li>
      <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ćwiczenie, które możesz zrobić dziś</span></li>
    </ul>
  </div>
  </div>
</body></html>
