<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>LI 03 · Warsztat</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- LI 03 · WORKSHOP · 1200×1500 · framed photograph on cream -->
<div class="ps-canvas ps-canvas--linkedin ps-canvas--sand">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__frame" style="height:620px">
    <img src="../../assets/photo/founders.jpg" alt="" style="object-position:50% 20%">
  </div>
  <div style="position:relative;z-index:2">
    <p class="ps-canvas__eyebrow">Warsztat</p>
    <h2 class="ps-canvas__hook" style="font-size:72px;max-width:15ch;margin:18px 0 30px">PCM Starter</h2>
    <div class="ps-cluster" style="gap:16px">
      <span class="ps-canvas__callout" style="font-size:30px;padding:16px 26px">0 dni</span>
      <span class="ps-canvas__callout" style="font-size:30px;padding:16px 26px">00 miejsc</span>
      <span class="ps-canvas__callout" style="font-size:30px;padding:16px 26px;background:var(--ps-gradient-deep);color:var(--ps-cream)">Zapisy otwarte</span>
    </div>
  </div>
  </div>
</body></html>
