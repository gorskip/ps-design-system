<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Postać · B · fala, osoba po prawej</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- LI POSTAĆ · B · 1200×1500
     Layers: deep green field, cream wave rising to the right, the person on the
     right in front of both, copy in the left lane. The oversized word sits on the
     green; the list sits on the cream. The face stays above the wave, clear of
     every line of copy. Swap the cut-out for another from assets/photo/cutout-*. -->
<div class="ps-canvas ps-canvas--linkedin ps-canvas--gradient-green-v">
  <svg class="ps-canvas__wave" viewBox="0 0 1080 1350" preserveAspectRatio="none" aria-hidden="true"><path d="M0 740 C 180 705 380 715 530 765 C 690 815 810 760 905 620 C 965 530 1020 500 1080 500 L1080 1350 L0 1350 Z"/></svg>
  <img class="ps-canvas__cutout" src="../../assets/photo/cutout-b.png" alt="Zuza" style="right:0;height:1156px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__lane" style="width:556px;margin:49px 0 auto">
    <p class="ps-canvas__kicker">Rozwiązujemy problemy</p>
    <p class="ps-canvas__word" style="margin-top:7px">HR</p>
    <p class="ps-canvas__kicker" style="margin-top:20px">Zanim zaczną spalać Twój czas i energię</p>
  </div>
  <div class="ps-canvas__lane" style="width:544px;color:var(--ps-teal-900)">
    <p style="margin:0"><span class="ps-canvas__bar" style="font-size:38px">HR to nie tylko rekrutacje i szkolenia.</span></p>
    <p style="margin:20px 0 16px;font-size:36px;font-weight:700;line-height:1.3">To procesy, dzięki którym ludzie wiedzą:</p>
    <ul class="ps-canvas__ticks" style="gap:9px">
      <li style="font-size:33px"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>kto za co odpowiada,</span></li>
      <li style="font-size:33px"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>jak rozmawiać o trudnościach,</span></li>
      <li style="font-size:33px"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>jak dowozić wyniki bez ciągłej presji.</span></li>
    </ul>
  </div>
</div>
</body></html>
