<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>09 · Mit kontra fakt</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 09 · MYTH vs FACT · 1080×1350 · cream field
     Two columns the reader can scan in a second. The cross is drawn, and it
     is violet-600 (the only text-safe violet) so the two halves read apart
     by shape AND colour, not colour alone. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--sand">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <p class="ps-canvas__eyebrow">Zarządzanie stresem</p>
    <h2 class="ps-canvas__title" style="font-size:72px;max-width:13ch;margin:24px 0 64px">Stres w zespole to nie kwestia charakteru</h2>

    <div style="display:grid;gap:40px">
      <div style="display:grid;grid-template-columns:52px 1fr;gap:24px;align-items:start">
        <span style="width:44px;display:block"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"/></svg></span>
        <div>
          <p style="font-size:30px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;opacity:.6;margin-bottom:8px">Mit</p>
          <p style="font-size:38px;line-height:1.3;margin:0">„Ona po prostu źle znosi presję."</p>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:52px 1fr;gap:24px;align-items:start">
        <span style="color:var(--ps-teal-900);width:44px;display:block"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div>
          <p style="font-size:30px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--ps-teal-900);margin-bottom:8px">Fakt</p>
          <p style="font-size:38px;line-height:1.3;margin:0">Każdy typ osobowości ma inny sygnał ostrzegawczy. Jej był widoczny od tygodnia.</p>
        </div>
      </div>
    </div>
  </div>
  </div>
</body></html>
