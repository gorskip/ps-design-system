<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>01 · Reels cover · napis</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 01 · REELS / VIDEO COVER · 1080×1350
     Their most common format. A frame from the recording with the subtitle
     burned in: white uppercase, ONE word in bright teal. The highlighted word
     is the point of the sentence, never a random noun. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--photo">
  <img class="ps-canvas__photo" src="../../assets/photo/founder-b.jpg" alt="">
  <div class="ps-canvas__scrim"></div>
  <div class="ps-canvas__layer">
    <span class="ps-canvas__stamp" style="color:var(--ps-cream)"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
    <div></div>
    <div style="display:grid;gap:40px">
      <p class="ps-canvas__subtitle">Awansujesz, bo jesteś z nami <em>najdłużej</em></p>
    </div>
  </div>
</div>
</body></html>
