<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>13 · Liczba na zieleni</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 13 · SINGLE STATISTIC ON THE GREEN GRADIENT · 1080×1350
     The green gradient is the second — and last — gradient in the system: no
     violet in it, so it can sit in the same grid as a signature-gradient post
     without two gradients fighting. Copy sits on the DEEP version only
     (cream clears AA across the whole ramp); the bright one stays in shapes. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--gradient-green">
  <img class="ps-canvas__motif ps-canvas__motif--br" src="../../assets/logo/mark-texture-dark.svg" alt="" style="width:760px;right:-250px;bottom:-240px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2;margin-top:auto;margin-bottom:auto">
    <hr class="ps-canvas__rule">
    <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-on-deep);margin-top:30px">Spotkania zarządu</p>
    <p style="font-size:250px;line-height:.86;font-weight:300;letter-spacing:-.05em;margin:28px 0 0">00<span style="font-size:104px;font-weight:400"> h</span></p>
    <p style="font-size:44px;line-height:1.25;max-width:17ch;margin-top:40px;font-weight:500">tygodniowo, zanim ktokolwiek nazwie, kto podejmuje decyzję.</p>
    <p style="font-size:30px;opacity:.8;margin-top:34px">Miejsce na źródło</p>
  </div>
</div>
</body></html>
