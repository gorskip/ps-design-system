<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Przeskalowani · post kwadratowy 1080×1080</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; it is outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- Edit the text below. Keep within the character limits noted in each
     element's comment — the canvas is fixed, so overlong copy WILL overflow.
     Export: screenshot .ps-canvas at 2x. See README. -->
<div class="ps-canvas ps-canvas--square ps-canvas--deep">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <img class="ps-canvas__motif ps-canvas__motif--br" src="../../assets/logo/mark-texture-dark.svg" alt="">
  <div>
    <!-- eyebrow: max ~28 chars -->
    <p class="ps-canvas__eyebrow">Świadome przywództwo</p>
    <hr class="ps-canvas__rule" style="margin-top:40px">
    <!-- title: max ~60 chars / 3 lines -->
    <h1 class="ps-canvas__title">Delegujesz, a i&nbsp;tak poprawiasz?</h1>
    <!-- body: max ~110 chars -->
    <p class="ps-canvas__body">To nie problem zespołu. To problem procesu, którego nikt nie ustalił.</p>
  </div>
</div>
</body></html>
