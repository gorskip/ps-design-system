<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>14 · Przed i po</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 14 · BEFORE / AFTER · 1080×1080
     Two fields, one line each. The contrast IS the design: the bright green
     gradient carries the "after" as a pure colour field with coal type
     (8.92:1 at the light end), the deep teal carries the "before". No icons,
     no arrows — the order of the two blocks is the arrow. -->
<div class="ps-canvas ps-canvas--square" style="padding:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr">
  <div style="background:var(--ps-cream);color:var(--ps-coal);padding:88px 88px 48px;display:flex;flex-direction:column;gap:32px">
    <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
    <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-900);margin-top:auto">Przed</p>
    <p style="font-size:58px;line-height:1.14;font-weight:300;letter-spacing:-.02em;max-width:17ch;margin:0">Każda decyzja wraca do właściciela.</p>
  </div>
  <div style="background:var(--ps-gradient-green-deep);color:var(--ps-cream);padding:48px 88px 88px;display:flex;flex-direction:column;justify-content:space-between;gap:32px">
    <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-on-deep)">Po</p>
    <p style="font-size:58px;line-height:1.14;font-weight:500;letter-spacing:-.02em;max-width:17ch;margin:0">Zespół wie, co rozstrzyga sam, i robi to.</p>
  </div>
</div>
</body></html>
