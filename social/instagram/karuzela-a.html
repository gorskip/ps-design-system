<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>02 · Karuzela · okładka</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 02 · CAROUSEL COVER · 1080×1350
     Mint field, big teal headline, one framed question. The cover's only job
     is to earn the first swipe, so it states the trap, not the solution. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--mint">
  <div class="ps-canvas__arc ps-canvas__arc--br"></div>
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <p class="ps-canvas__eyebrow" style="opacity:.75">Pułapki nowego menedżera</p>
    <h1 class="ps-canvas__hook" style="margin-top:28px">Porównujesz się z szefem, o którym wiesz tyle, co z korytarza</h1>
  </div>
  <div style="position:relative;z-index:2;display:grid;gap:44px">
    <span class="ps-canvas__callout">To jest pułapka.</span>
    <div class="ps-canvas__foot">
      <span class="ps-canvas__swipe">Przesuń
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
  </div>
</div>
</body></html>
