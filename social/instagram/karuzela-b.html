<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>03 · Karuzela · slajd</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 03 · CAROUSEL BODY SLIDE · 1080×1350
     White field so a run of slides doesn't tire the eye. Ticks are drawn SVG,
     never ✅. Slide counter top-right so the reader knows the length. -->
<div class="ps-canvas ps-canvas--portrait">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:48px">
      <p class="ps-canvas__eyebrow" style="color:var(--ps-teal-900)">Co widzisz z zewnątrz</p>
      <span class="ps-canvas__step">02 / 06</span>
    </div>
    <h2 class="ps-canvas__title" style="font-size:66px;max-width:14ch;margin-bottom:52px">Jego zespół wydaje się spokojny</h2>
    <ul class="ps-canvas__ticks">
      <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Jego komunikacja wygląda na naturalną.</span></li>
      <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Decyzje podejmuje bez wahania.</span></li>
      <li><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Nikt nie słyszał, żeby podniósł głos.</span></li>
    </ul>
    <p style="font-size:34px;line-height:1.35;margin-top:52px;max-width:24ch">
      I myślisz: <b style="font-weight:700">„ja tak nie potrafię ».</b>
    </p>
  </div>
  </div>
</body></html>
