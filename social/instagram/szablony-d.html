<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Przeskalowani · slajd karuzeli 1080×1350</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; it is outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- Edit the text below. Keep within the character limits noted in each
     element's comment — the canvas is fixed, so overlong copy WILL overflow.
     Export: screenshot .ps-canvas at 2x. See README. -->
<!-- One file per slide, or duplicate the .ps-canvas block and screenshot each.
     Slide 1 should be the cover (ink or gradient); body slides use cream;
     the last slide is the CTA. -->
<div class="ps-canvas ps-canvas--portrait">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div>
    <div class="ps-canvas__foot" style="margin-bottom:72px">
      <span class="ps-canvas__eyebrow">Skuteczna komunikacja</span>
      <span class="ps-canvas__step">02 / 06</span>
    </div>
    <hr class="ps-canvas__rule">
    <h1 class="ps-canvas__title">Nie mów „zróbmy to lepiej”</h1>
    <p class="ps-canvas__body">Powiedz, co dokładnie ma być inaczej, do kiedy i po czym poznacie, że się udało.</p>
  </div>
  <div class="ps-canvas__foot">
    <span class="ps-canvas__handle">Przesuń →</span>
  </div>
</div>
</body></html>
