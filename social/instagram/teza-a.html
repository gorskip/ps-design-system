<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>04 · Lista · 4 pozycje życiowe</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 04 · LIST POST · 1080×1350
     Straight from their blog ("pozycje życiowe", Analiza Transakcyjna).
     A list post has to be readable at thumbnail size, so four items maximum. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--mint">
  <div class="ps-canvas__arc ps-canvas__arc--tr"></div>
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <p class="ps-canvas__eyebrow" style="opacity:.75">Analiza transakcyjna</p>
    <h2 class="ps-canvas__title" style="font-size:72px;max-width:13ch;margin:24px 0 56px">Cztery pozycje, z których zaczynasz relację</h2>
    <div class="ps-canvas__item"><b>01</b><span>Ja OK, Ty OK: <b style="color:inherit">współdziałanie</b></span></div>
    <div class="ps-canvas__item"><b>02</b><span>Ja nie OK, Ty OK: <b style="color:inherit">unikanie</b></span></div>
    <div class="ps-canvas__item"><b>03</b><span>Ja OK, Ty nie OK: <b style="color:inherit">odrzucenie</b></span></div>
    <div class="ps-canvas__item"><b>04</b><span>Ja nie OK, Ty nie OK: <b style="color:inherit">bezradność</b></span></div>
  </div>
  <div class="ps-canvas__foot">
    <span class="ps-canvas__swipe">Z której zaczynasz?</span>
  </div>
</div>
</body></html>
