<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>06 · O nas · split</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 06 · FOUNDERS / ABOUT · 1080×1350
     Split layout: the photograph never carries the copy, so contrast is fixed
     rather than dependent on what happens to be behind the words.
     NOTE: the names are left off deliberately — I can't tell from the
     photographs which founder is which. Add them before publishing. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--split">
  <div class="ps-canvas__media">
    <img src="../../assets/photo/founders.jpg" alt="Założycielki Przeskalowanych">
  </div>
  <div class="ps-canvas__panel ps-canvas--mint" style="color:var(--ps-teal-900)">
    <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
    <div>
      <p class="ps-canvas__eyebrow" style="opacity:.75">Cześć! Tu Zuza i Asia</p>
      <h2 class="ps-canvas__title" style="font-size:62px;max-width:15ch;margin-top:22px">Firma urosła trzy razy. Menedżerowie zostali ci sami</h2>
    </div>
    </div>
</div>
</body></html>
