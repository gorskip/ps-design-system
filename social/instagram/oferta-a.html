<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>07 · Oferta · CTA komentarz</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 07 · OFFER / LEAD MAGNET · 1080×1350
     Uses their established "comment a keyword to get the link" mechanic —
     comments feed the algorithm far better than a link in bio does.
     The keyword is ONE short word, uppercase, impossible to mistype. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--mint">
  <div class="ps-canvas__arc ps-canvas__arc--br" style="width:520px;height:430px;right:-200px;bottom:-220px"></div>
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div style="position:relative;z-index:2">
    <h2 class="ps-canvas__hook" style="font-size:78px">Myślisz, że wiesz, jak pracujesz?</h2>
    <p class="ps-canvas__body" style="margin-top:32px;max-width:26ch;font-size:36px">
      W 7 minut zobaczysz, jak naprawdę działasz pod presją.
    </p>
  </div>
  <div style="position:relative;z-index:2;display:grid;gap:36px;justify-items:start">
    <span class="ps-canvas__callout">Test Stylów Pracy · bezpłatny</span>
    <span class="ps-canvas__callout ps-canvas__callout--quiet" style="padding-left:0;font-size:32px">
      Skomentuj <b style="color:var(--ps-teal-900)">TEST</b>, a wyślemy Ci link.
    </span>
    </div>
</div>
</body></html>
