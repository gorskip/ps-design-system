<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Postać · A · rozmowa, dymek</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- POSTAĆ · A · 1080×1350
     What one of us says, in her own words. The two-part headline sits in label
     boxes, the speech bubble carries the line, and the person stands bottom-left
     in front of the mint field, looking toward the bubble. The bubble's tail
     points toward her; it never covers the face. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--mint">
  <img class="ps-canvas__cutout" src="../../assets/photo/cutout-a.png" alt="Asia" style="left:-30px;height:790px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__labels" style="margin:56px 0 0">
    <span class="ps-canvas__label">Delegujesz</span>
    <p class="ps-canvas__joint">albo</p>
    <span class="ps-canvas__label ps-canvas__label--paper" style="margin-inline-start:120px">Kontrolujesz</span>
  </div>
  <div class="ps-canvas__bubble" style="margin:48px 0 auto;max-width:520px">
    <p><span class="ps-canvas__tag">Delegacyjny poker</span> to proste narzędzie, które pomaga ustalić, ile odpowiedzialności naprawdę chcesz oddać zespołowi.</p>
  </div>
</div>
</body></html>
