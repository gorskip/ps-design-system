<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>11 · Warsztat · zapowiedź</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 11 · WORKSHOP ANNOUNCEMENT · 1080×1350 · cream + framed photo
     Cream sits better beside the warm photography than white does. The photo
     is framed rather than bled, so the copy never competes with the image. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--sand">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-light.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__frame" style="height:560px">
    <img src="../../assets/photo/founders.jpg" alt="" style="object-position:50% 20%">
  </div>
  <div style="position:relative;z-index:2;margin-top:56px">
    <p class="ps-canvas__eyebrow">Warsztat</p>
    <h2 class="ps-canvas__title" style="font-size:66px;max-width:14ch;margin:20px 0 28px">PCM Starter</h2>
    <div class="ps-cluster" style="gap:16px">
      <span class="ps-canvas__callout" style="font-size:30px;padding:14px 24px">0 dni</span>
      <span class="ps-canvas__callout" style="font-size:30px;padding:14px 24px">00 miejsc</span>
      <span class="ps-canvas__callout" style="font-size:30px;padding:14px 24px;background:var(--ps-gradient-deep);color:var(--ps-cream)">Zapisy otwarte</span>
    </div>
  </div>
  </div>
</body></html>
