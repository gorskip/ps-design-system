<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>12 · Karuzela · slajd końcowy</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 12 · CAROUSEL CLOSING SLIDE · 1080×1350 · coal
     The last slide of every carousel. It asks for exactly ONE action — a
     slide offering three choices gets none of them taken. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--deep">
  <span class="ps-canvas__stamp" style="color:var(--ps-cream)"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <img class="ps-canvas__motif ps-canvas__motif--br" src="../../assets/logo/mark-texture-dark.svg" alt="">
  <div style="position:relative;z-index:2;margin-top:auto">
    <hr class="ps-canvas__rule">
    <h2 class="ps-canvas__hook" style="font-size:84px">Z której pozycji zaczynasz rozmowę?</h2>
    <p class="ps-canvas__body" style="margin-top:32px;max-width:24ch">Napisz w komentarzu numer. Odpowiemy każdemu.</p>
  </div>
  <div style="position:relative;z-index:2;margin-top:auto;display:grid;gap:40px">
    <span class="ps-canvas__callout" style="background:var(--ps-teal-500);border-color:var(--ps-teal-500);color:var(--ps-coal)">Zapisz ten post na później</span>
    </div>
</div>
</body></html>
