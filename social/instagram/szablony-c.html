<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Przeskalowani · cytat 1080×1080</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; it is outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- Edit the text below. Keep within the character limits noted in each
     element's comment — the canvas is fixed, so overlong copy WILL overflow.
     Export: screenshot .ps-canvas at 2x. See README. -->
<div class="ps-canvas ps-canvas--square ps-canvas--gradient-green">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <img class="ps-canvas__motif ps-canvas__motif--bl" src="../../assets/logo/mark-texture-dark.svg" alt="">
  <div>
    <hr class="ps-canvas__rule">
    <!-- quote: max ~130 chars. Longer than that and it stops being a quote card. -->
    <blockquote class="ps-canvas__quote">Zespół zaczął współpracować, zamiast rywalizować.</blockquote>
    <p class="ps-canvas__body" style="margin-top:48px;opacity:.78">Miejsce na imię i nazwisko</p>
  </div>
</div>
</body></html>
