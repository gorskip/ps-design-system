<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>Postać · D · we dwie</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- POSTAĆ · D · 1080×1350
     Asia and Zuza together. The copy sits on the deep green above their heads;
     the two of them stand in front of a cream wave that rises behind them. Keep
     the headline to two lines: anything longer pushes into their faces. -->
<div class="ps-canvas ps-canvas--portrait ps-canvas--gradient-green-v">
  <svg class="ps-canvas__wave" viewBox="0 0 1080 1350" preserveAspectRatio="none" aria-hidden="true"><path d="M0 900 C 220 840 420 700 620 690 C 820 680 960 760 1080 820 L1080 1350 L0 1350 Z"/></svg>
  <img class="ps-canvas__cutout" src="../../assets/photo/cutout-duo.png" alt="Asia i Zuza" style="left:40px;width:980px">
  <span class="ps-canvas__stamp"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span>
  <div class="ps-canvas__lane" style="width:900px;margin:44px 0 auto">
    <p class="ps-canvas__kicker" style="font-size:34px;opacity:.85">Asia i Zuza</p>
    <p class="ps-canvas__title" style="margin-top:14px;font-size:76px;max-width:none">Działamy operacyjnie, a&nbsp;nie doradczo.</p>
  </div>
</div>
</body></html>
