<!doctype html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<title>08 · Story 1080×1920</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>body{margin:0;display:grid;place-items:start;background:#6b6b6b}</style>
</head>
<body>
<!-- 08 · STORY / REELS COVER · 1080×1920
     Add class ps-canvas--guides to the canvas to see Instagram's UI safe
     zones (top 250px, bottom 420px). Nothing that must be read goes there.
     Remove the class before exporting. -->
<div class="ps-canvas ps-canvas--story ps-canvas--photo">
  <img class="ps-canvas__photo" src="../../assets/photo/founder-a.jpg" alt="" style="object-position:50% 22%">
  <div class="ps-canvas__scrim ps-canvas__scrim--brand"></div>
  <div class="ps-canvas__layer">
    <div style="margin-top:60px"><span class="ps-canvas__stamp" style="color:var(--ps-cream)"><img src="../../assets/logo/mark-dark.svg" alt="">Przeskalowani</span></div>
    <div style="display:grid;gap:40px;padding-bottom:40px">
      <p class="ps-canvas__eyebrow" style="color:var(--ps-cream);opacity:.85">Nowy odcinek</p>
      <h2 class="ps-canvas__hook" style="font-size:86px">Pierwsze spotkanie 1:1? Nie zaczynaj od zadań.</h2>
      <span class="ps-canvas__callout" style="border-color:var(--ps-teal-500);background:transparent;color:var(--ps-cream)">Zobacz cały odcinek</span>
    </div>
  </div>
</div>
</body></html>
