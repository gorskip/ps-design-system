<!-- OGÓLNY · slajd na wszystko, czego nie obejmują nazwane typy. Cztery układy na jasnym polu. Układ: akapit tekstu i miejsce na obraz. Podmień .ps-canvas__imgslot na obraz o tych samych wymiarach. -->
<div class="ps-canvas ps-canvas--slide"><div class="ps-canvas__head"><span class="ps-canvas__lockup ps-canvas__lockup--mark"><img src="../../assets/logo/mark-light.svg" alt=""></span></div><div style="position:relative;z-index:2"><p class="ps-canvas__eyebrow" style="color:var(--ps-teal-900)">Przykład</p><h2 class="ps-canvas__title" style="font-size:64px;margin:16px 0 56px">Akapit i obraz obok siebie</h2></div><div class="ps-canvas__content"><div style="display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start"><p style="font-size:38px;line-height:1.4;margin:0">Gdy słowa potrzebują dowodu: schemat, zrzut ekranu albo zdjęcie z warsztatu. Tekst zostaje krótki i tłumaczy, na co sala ma patrzeć.</p><div class="ps-canvas__imgslot">Miejsce na obraz</div></div></div><div class="ps-canvas__foot"><span class="ps-canvas__slideno">00</span></div></div>
