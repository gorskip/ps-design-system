<!-- CENNIK · opcje. Wyróżniona jest ETYKIETĄ, nigdy większym kafelkiem — rozmiar czyta się jako „drogo”, etykieta jako „ta”. Wariant C (ciemny): dwie opcje, gdy wybór jest binarny. Kafelki mają własny kolor tekstu — na ciemnym polu nie wolno im dziedziczyć kremu. -->
<div class="ps-canvas ps-canvas--slide ps-canvas--deep"><div class="ps-canvas__head"><span class="ps-canvas__lockup ps-canvas__lockup--mark"><img src="../../assets/logo/mark-dark.svg" alt=""></span></div><div style="position:relative;z-index:2"><p class="ps-canvas__eyebrow" style="color:var(--ps-teal-on-deep)">Zakres</p><h2 class="ps-canvas__title" style="font-size:60px;margin:16px 0 42px">Dwa sposoby, żeby zacząć</h2></div><div class="ps-canvas__content ps-canvas__plans" style="position:relative;z-index:2;grid-template-columns:repeat(2,1fr)"><div class="ps-canvas__plan"><h3>Warsztat</h3><span class="ps-canvas__price">0 000 zł<small> / dzień</small></span><p>Jeden dzień z zespołem. Do 00 osób.</p></div><div class="ps-canvas__plan ps-canvas__plan--pick"><span class="ps-canvas__plan-tag">Najczęściej</span><h3>Program</h3><span class="ps-canvas__price">0 000 zł<small> / miesiąc</small></span><p>Warsztaty, coaching liderów i diagnoza. Trzy do sześciu miesięcy.</p></div></div><div class="ps-canvas__foot"><span class="ps-canvas__slideno">21</span></div></div>
