<!doctype html>
<html lang="pl" data-theme="light">
<head>

<title>Cennik · D · ze zdjęciem</title>
<link rel="stylesheet" href="../../ps-design-system.css">
<link rel="stylesheet" href="../../social/social.css">
<!-- Grey editor backdrop only; outside .ps-canvas and never exported. -->
<style>html,body{margin:0;background:#6b6b6b}body{display:grid;place-items:start}</style>
</head>
<body>
<!-- CENNIK · opcje. Wyróżniona jest ETYKIETĄ, nigdy większym kafelkiem — rozmiar czyta się jako „drogo”, etykieta jako „ta”. Wariant D (ze zdjęciem): dwie opcje w kolumnie obok kadru — wersja na spotkanie jeden na jeden. -->
<div class="ps-canvas ps-canvas--slide ps-canvas--wide ps-canvas--wide-60"><div class="ps-canvas__head"><span class="ps-canvas__lockup ps-canvas__lockup--mark"><img src="../../assets/logo/mark-light.svg" alt=""></span></div><div class="ps-canvas__panel ps-canvas--sand"><div style="position:relative;z-index:2;margin-top:auto"><p class="ps-canvas__eyebrow" style="color:var(--ps-teal-900)">Zakres</p><h2 class="ps-canvas__title" style="font-size:48px;margin:14px 0 30px">Dwa sposoby, żeby zacząć</h2><div style="display:grid;gap:22px"><div style="display:flex;justify-content:space-between;gap:24px;padding-block:18px;border-block-start:var(--ps-outline-thin) solid var(--ps-color-border)"><span style="font-size:36px">Warsztat</span><b style="font-size:36px;color:var(--ps-teal-900)">0 000 zł</b></div><div style="display:flex;justify-content:space-between;gap:24px;padding-block:18px;border-block-start:var(--ps-outline-thin) solid var(--ps-color-border)"><span style="font-size:36px">Program</span><b style="font-size:36px;color:var(--ps-teal-900)">0 000 zł</b></div></div></div><div class="ps-canvas__foot"><span class="ps-canvas__slideno">24</span></div></div><div class="ps-canvas__media"><img src="../../assets/photo/founder-a.jpg" alt="" width="1200" height="1500" style="object-position:50% 20%"></div></div>
</body></html>
