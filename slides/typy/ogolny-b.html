<!doctype html>

<!-- OGÓLNY · slajd na wszystko, czego nie obejmują nazwane typy. Cztery układy na jasnym polu. Układ: tekst w trzech kolumnach. -->
<div class="ps-canvas ps-canvas--slide"><div class="ps-canvas__head"><span class="ps-canvas__lockup ps-canvas__lockup--mark"><img src="../../assets/logo/mark-light.svg" alt=""></span></div><div style="position:relative;z-index:2"><p class="ps-canvas__eyebrow" style="color:var(--ps-teal-900)">Jak patrzymy na zespół</p><h2 class="ps-canvas__title" style="font-size:64px">Trzy miejsca, w które patrzymy</h2></div><div class="ps-canvas__content"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:64px"><div><h3 style="font-size:44px;font-weight:700;margin:0 0 18px;color:var(--ps-teal-900)">Ludzie</h3><p style="font-size:36px;line-height:1.35;margin:0">Kto z kim rozmawia i co zostaje niewypowiedziane.</p></div><div><h3 style="font-size:44px;font-weight:700;margin:0 0 18px;color:var(--ps-teal-900)">Procesy</h3><p style="font-size:36px;line-height:1.35;margin:0">Gdzie decyzja powstaje, a gdzie utyka.</p></div><div><h3 style="font-size:44px;font-weight:700;margin:0 0 18px;color:var(--ps-teal-900)">Cele</h3><p style="font-size:36px;line-height:1.35;margin:0">Po czym poznacie, że zmiana naprawdę działa.</p></div></div></div><div class="ps-canvas__foot"><span class="ps-canvas__slideno">00</span></div></div>
